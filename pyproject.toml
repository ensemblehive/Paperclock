[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperclock"
version = "0.4.0"
description = "A private deadline radar for the dates hiding in your files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Paperclock contributors" }]
dependencies = [
  "pdfplumber>=0.11.7,<0.12",
  "extract-msg>=0.49,<0.50",
  "defusedxml>=0.7,<1",
  "rapidocr-onnxruntime>=1.3.0",
  "Pillow>=10.0.0",
]
keywords = ["deadlines", "documents", "calendar", "privacy", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
paperclock = "paperclock.cli:main"

[tool.setuptools.packages.find]
include = ["paperclock*"]
