[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperclock"
version = "0.3.1"
description = "A private deadline radar for the dates hiding in your files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paperclock contributors" }]
dependencies = ["pypdf>=5,<7"]
keywords = ["deadlines", "documents", "calendar", "privacy", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
paperclock = "paperclock.cli:main"

[tool.setuptools.packages.find]
include = ["paperclock*"]
